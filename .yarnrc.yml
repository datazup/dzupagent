approvedGitRepositories:
  - "**"

# Pinned explicitly rather than inherited from the workspace-root .yarnrc.yml.
#
# Yarn 4 defaults `nodeLinker` to `pnp`. This repo only ever resolved to
# `node-modules` because it physically sits inside the workspace-root tree and
# picked the setting up from the parent config. A git worktree created OUTSIDE
# that tree (e.g. under /tmp) loses the parent and silently falls back to PnP,
# which this repo's toolchain cannot build under.
#
# The failure mode is silent, not loud: `turbo build` reports "0 successful,
# 5 total" with no dist/ emitted, and ~218 of 298 test files then fail to
# collect. Pinning it here makes the linker a property of the repo itself, so
# worktrees behave identically wherever they are created.
#
# Matches shared-kit, ui, codev-app, and research-app, which all pin it.
nodeLinker: node-modules

npmMinimalAgeGate: 0
