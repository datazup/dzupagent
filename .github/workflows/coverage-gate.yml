name: Coverage Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/check-workspace-coverage.mjs'
      - 'coverage-thresholds.json'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/coverage-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/check-workspace-coverage.mjs'
      - 'coverage-thresholds.json'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/coverage-gate.yml'

permissions:
  contents: read

concurrency:
  group: coverage-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-packages:
    runs-on:
      group: datazup-public-builders
      labels: coolify-cicd-codev
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate coverage matrix
        id: generate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const repoRoot = process.cwd()
          const packagesDir = path.join(repoRoot, 'packages')
          const entries = fs.readdirSync(packagesDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => entry.name)
            .filter((folder) => {
              const packageJsonPath = path.join(packagesDir, folder, 'package.json')
              if (!fs.existsSync(packageJsonPath)) {
                return false
              }
              const pkg = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'))
              return Boolean(pkg?.scripts?.['test:coverage'])
            })
            .map((folder) => {
              const pkg = JSON.parse(fs.readFileSync(path.join(packagesDir, folder, 'package.json'), 'utf8'))
              return {
                folder,
                workspace: pkg.name,
              }
            })
            .sort((left, right) => left.workspace.localeCompare(right.workspace))

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include: entries })}\n`)
          NODE
    if: ${{ (github.repository == 'datazup/dzupagent' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}

  package-coverage:
    runs-on:
      group: datazup-public-builders
      labels: coolify-cicd-codev
    timeout-minutes: 25
    needs: discover-packages
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-packages.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .ci-isolated/dzupagent
          persist-credentials: false
      - name: Create Scripts contract source read token
        id: scripts-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.DATAZUP_BUILD_APP_ID }}
          private-key: ${{ secrets.DATAZUP_BUILD_APP_PRIVATE_KEY }}
          owner: datazup
          repositories: scripts
          permission-contents: read
        if: ${{ matrix.workspace == '@dzupagent/core' }}
      - name: Checkout pinned Scripts contract source
        uses: actions/checkout@v4
        with:
          repository: datazup/scripts
          ref: 4d9309e7e7cc74d194712419d3bc2f526db7e712
          token: ${{ steps.scripts-token.outputs.token }}
          path: .ci-isolated/scripts
          persist-credentials: false
        if: ${{ matrix.workspace == '@dzupagent/core' }}

      # MUST precede setup-node. `cache: yarn` makes setup-node shell out to
      # `yarn cache dir` during its own step, and the runner's preinstalled Yarn
      # is 1.22, which refuses a project declaring `packageManager: yarn@4.16.0`.
      # Enabling Corepack after setup-node is too late — that is why every
      # workflow here failed at "Setup Node.js" on every push since 2026-06-30.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: .ci-isolated/dzupagent/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build package dependencies
        run: yarn build --filter="${{ matrix.workspace }}..."

      - name: Run package coverage
        run: yarn workspace "${{ matrix.workspace }}" test:coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.folder }}
          path: .ci-isolated/dzupagent/packages/${{ matrix.folder }}/coverage/
          if-no-files-found: error
          retention-days: 7
    if: ${{ (github.repository == 'datazup/dzupagent' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
    defaults:
      run:
        working-directory: .ci-isolated/dzupagent
        shell: bash

  workspace-coverage-gate:
    runs-on:
      group: datazup-public-builders
      labels: coolify-cicd-codev
    timeout-minutes: 10
    needs: package-coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MUST precede setup-node. `cache: yarn` makes setup-node shell out to
      # `yarn cache dir` during its own step, and the runner's preinstalled Yarn
      # is 1.22, which refuses a project declaring `packageManager: yarn@4.16.0`.
      # Enabling Corepack after setup-node is too late — that is why every
      # workflow here failed at "Setup Node.js" on every push since 2026-06-30.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts

      - name: Restore coverage summaries
        run: |
          shopt -s nullglob
          for artifact_dir in coverage-artifacts/coverage-*; do
            artifact_name="${artifact_dir##*/}"
            folder="${artifact_name#coverage-}"
            mkdir -p "packages/${folder}/coverage"
            cp -R "${artifact_dir}/." "packages/${folder}/coverage/"
          done

      - name: Enforce workspace coverage gate
        run: yarn test:coverage:workspace
    if: ${{ (github.repository == 'datazup/dzupagent' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
