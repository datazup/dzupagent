dsl: dzupflow/v1
id: sdlc-batch-validation-example
version: 1
uses:
  sdlc: dzup.sdlc@1
inputs:
  validationItems:
    type: array
    required: true
steps:
  - sdlc.batch_validation:
      id: validation_batch
      items: inputs.validationItems
      concurrency: 1
      failFast: false
      output: validationStatuses
